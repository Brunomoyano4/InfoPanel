<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>InfoPanel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Emparejamiento -->
  <section id="pair" class="pair hidden">
    <div class="pair-box">
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>InfoPanel</h1>
      <p>Ingresá el PIN que muestra la consola de la PC.</p>
      <form id="pair-form">
        <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
        <button type="submit" class="btn primary">Conectar</button>
      </form>
      <p id="pair-error" class="error"></p>
    </div>
  </section>

  <!-- App -->
  <main id="app" class="hidden">
    <header class="top">
      <button id="machine" class="machine-btn" aria-label="Cambiar de PC">
        <span class="machine"><span id="machine-name">—</span> <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        <span id="cpu-name" class="sub">—</span>
      </button>
      <div id="status" class="status off"><i aria-hidden="true"></i><span>Desconectado</span></div>
    </header>
    <div id="views">
      <section data-view="overview" class="view active">
        <div id="install-banner" class="install-banner hidden">
          <a href="/setup.html">📲 Instalar como app →</a>
          <button class="btn ghost sm" id="install-dismiss" aria-label="Ocultar aviso">✕</button>
        </div>
        <div class="dash-bar">
          <select id="dash-select" aria-label="Dashboard"></select>
          <button class="btn icon" id="dash-opts" aria-label="Opciones del dashboard" title="Opciones del dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          <button class="btn icon" id="dash-edit" aria-label="Editar dashboard" title="Editar dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        </div>
        <div class="dash-tools hidden" id="dash-tools">
          <button class="btn outline" id="dash-add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Widget</button>
          <button class="btn icon" id="dash-settings" aria-label="Ajustes del dashboard" title="Ajustes del dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
          <span class="spacer"></span>
          <button class="btn ghost" id="dash-cancel">Cancelar</button>
          <button class="btn primary" id="dash-save">Guardar</button>
        </div>
        <div id="dash" class="dash"></div>
      </section>
      <section data-view="sensors" class="view">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="sensor-filter" placeholder="Buscar sensor" aria-label="Buscar sensor">
        </label>
        <div class="chips" id="sensor-types" role="group" aria-label="Filtrar por tipo"></div>
        <div id="sensors"></div>
      </section>
      <section data-view="processes" class="view">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="proc-filter" placeholder="Buscar proceso o PID" aria-label="Buscar proceso">
        </label>
        <div id="processes"></div>
      </section>
      <section data-view="control" class="view">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="control-filter" placeholder="Buscar control" aria-label="Buscar control">
        </label>
        <div class="chips" id="control-cats" role="group" aria-label="Filtrar por categoría"></div>
        <div id="control"></div>
        <p class="note empty-filter hidden" id="control-empty">No hay controles que coincidan.</p>
      </section>
    </div>

    <!-- Pestañas: abajo en el celu, barra lateral en escritorio -->
    <nav class="tabs" aria-label="Secciones">
      <div class="rail-brand" aria-hidden="true"><img src="icon.svg" alt="" width="30" height="30"><span>InfoPanel</span></div>
      <button data-tab="overview" class="active"><span class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Panel</button>
      <button data-tab="sensors"><span class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg></span>Sensores</button>
      <button data-tab="processes"><span class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>Procesos</button>
      <button data-tab="control"><span class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>Control</button>
    </nav>
  </main>

  <!-- Ventana modal (configuración de widgets y dashboards) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modal-title"></h2><button class="btn icon round" id="modal-close" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
